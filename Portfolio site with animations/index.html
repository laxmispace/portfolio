
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>laxmimahajan</title>
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <meta name="description" content="Showcases a UX designer&#39;s portfolio with interactive frames and subtle animations to highlight design skills and project states effectively." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        // Restores the real URL that public/404.html redirected here from, before the
        // app's own router (ProjectsSection.tsx / TinkeringSection.tsx) reads location.pathname.
        // Adapted from https://github.com/rafgraph/spa-github-pages
        (function (l) {
          if (l.search[1] === "/") {
            var decoded = l.search
              .slice(1)
              .split("&")
              .map(function (s) {
                return s.replace(/~and~/g, "&");
              })
              .join("?");
            window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
          }
        })(window.location);
      </script>

    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
